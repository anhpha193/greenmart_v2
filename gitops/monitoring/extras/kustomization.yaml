# Phần bổ sung cho stack giám sát: PodMonitor (Prometheus scrape GreenMart) và dashboard Grafana.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring

resources:
  - podmonitor-greenmart.yaml

generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"   # sidecar của Grafana tự nạp ConfigMap có nhãn này

configMapGenerator:
  - name: dashboard-greenmart-overview
    files:
      - dashboards/greenmart-overview.json
