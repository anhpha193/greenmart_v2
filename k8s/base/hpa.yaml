# Cần metrics-server trong cluster. Tổng maxReplicas tính cho 4 node c7i-flex.large (8 vCPU): request CPU mỗi pod
# nhỏ (50-100m) nên lịch được hết; CPU thật mới là giới hạn, theo dõi trên Grafana (dashboard GreenMart overview).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: web
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: greenmart
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: web
  minReplicas: 2
  maxReplicas: 8
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70

