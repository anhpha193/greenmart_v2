# Nội dung nginx.conf/proxy_params tương ứng gateway/ trong repo (docker compose) – sửa một nơi thì sửa cả hai.
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-nginx
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: greenmart
data:
  nginx.conf: |
    # Mặc định nginx chỉ có 1 worker, 512 kết nối: lúc tải cao ALB nhận 502. Mỗi CPU một worker, 4096 kết nối/worker.
    worker_processes auto;
    worker_rlimit_nofile 16384;
    events { worker_connections 4096; multi_accept on; }

    http {
        include       /etc/nginx/mime.types;
        client_max_body_size 10m;
        # Log theo lô 64KB / 5 giây thay vì ghi từng dòng (đỡ syscall ở ~1.000 req/s)
        access_log /var/log/nginx/access.log combined buffer=64k flush=5s;
        sendfile on;
        tcp_nopush on;
        keepalive_timeout 65;
        gzip on;
        gzip_min_length 1024;
        gzip_types text/css application/javascript application/json image/svg+xml text/plain;

        # Đứng sau Ingress đã kết thúc TLS: giữ scheme gốc (https) để Django nhận đúng khi kiểm tra CSRF/cookie.
        map $http_x_forwarded_proto $fwd_proto { default $http_x_forwarded_proto; "" $scheme; }

        # Microcache cho 4 trang công khai (HTML giống nhau cho mọi người; phần riêng do gm.js lấy qua /api/me/).
        # Mỗi trang chỉ render lại tối đa 1 lần mỗi 10 giây (mỗi pod gateway có cache riêng) cho mọi người dùng; response có Set-Cookie không bao giờ được cache.
        proxy_cache_path /var/cache/nginx/micro levels=1:2 keys_zone=micro:10m max_size=100m inactive=60s use_temp_path=off;

        upstream web             { server web:8000; keepalive 32; }
        upstream web_auth        { server web-auth:8000; keepalive 16; }
        upstream user_service    { server user-service:8000; keepalive 32; }
        upstream catalog_service { server catalog-service:8000; keepalive 32; }

        server {
            listen 80;

            location = /gateway-health { access_log off; default_type text/plain; return 200 "ok
    "; }

            location /static/ { alias /staticfiles/; expires 1d; add_header Cache-Control "public"; access_log off; }
            location /media/  { alias /media/; }
            location = /metrics { return 404; }

            # Đăng nhập/đăng ký/đặt lại mật khẩu sang web-auth (tách khỏi web để không làm treo trang mua sắm)
            location ~ ^/(loginn|register|resert)  { proxy_pass http://web_auth; include /etc/nginx/proxy_params; }
            # Trang công khai: qua microcache
            location = / {
                proxy_pass http://web; include /etc/nginx/proxy_params;
                proxy_cache micro; proxy_cache_key "$scheme$host$request_uri"; proxy_cache_valid 200 10s;
                proxy_cache_lock on; proxy_cache_lock_timeout 2s; proxy_cache_use_stale updating error timeout; proxy_cache_background_update on;
                proxy_ignore_headers Vary Cache-Control Expires;   # Set-Cookie KHÔNG bị bỏ qua: có Set-Cookie thì không cache
                add_header X-Cache $upstream_cache_status always;
            }
            location /productPage/ {
                proxy_pass http://web; include /etc/nginx/proxy_params;
                proxy_cache micro; proxy_cache_key "$scheme$host$request_uri"; proxy_cache_valid 200 10s;
                proxy_cache_lock on; proxy_cache_lock_timeout 2s; proxy_cache_use_stale updating error timeout; proxy_cache_background_update on;
                proxy_ignore_headers Vary Cache-Control Expires;   # Set-Cookie KHÔNG bị bỏ qua: có Set-Cookie thì không cache
                add_header X-Cache $upstream_cache_status always;
            }
            location /detail/ {
                proxy_pass http://web; include /etc/nginx/proxy_params;
                proxy_cache micro; proxy_cache_key "$scheme$host$request_uri"; proxy_cache_valid 200 10s;
                proxy_cache_lock on; proxy_cache_lock_timeout 2s; proxy_cache_use_stale updating error timeout; proxy_cache_background_update on;
                proxy_ignore_headers Vary Cache-Control Expires;   # Set-Cookie KHÔNG bị bỏ qua: có Set-Cookie thì không cache
                add_header X-Cache $upstream_cache_status always;
            }
            location = /search {
                proxy_pass http://web; include /etc/nginx/proxy_params;
                proxy_cache micro; proxy_cache_key "$scheme$host$request_uri"; proxy_cache_valid 200 10s;
                proxy_cache_lock on; proxy_cache_lock_timeout 2s; proxy_cache_use_stale updating error timeout; proxy_cache_background_update on;
                proxy_ignore_headers Vary Cache-Control Expires;   # Set-Cookie KHÔNG bị bỏ qua: có Set-Cookie thì không cache
                add_header X-Cache $upstream_cache_status always;
            }
            location /admin/catalog/ { proxy_pass http://catalog_service; include /etc/nginx/proxy_params; }
            location /admin/         { proxy_pass http://user_service;    include /etc/nginx/proxy_params; }
            location /               { proxy_pass http://web;             include /etc/nginx/proxy_params; }
        }
    }
  proxy_params: |
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: greenmart
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway
        app.kubernetes.io/part-of: greenmart
    spec:
      # Rải pod đều các node: không để một node 100% CPU trong khi node khác còn trống
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: gateway
      automountServiceAccountToken: false
      initContainers:
      - name: static-web
        image: greenmart/web
        imagePullPolicy: IfNotPresent
        command:
        - python
        - manage.py
        - collectstatic
        - --noinput
        env:
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: greenmart-secrets
              key: SECRET_KEY
        - name: INTERNAL_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: greenmart-secrets
              key: INTERNAL_API_TOKEN
        - name: DB_NAME
          value: unused
        - name: DB_USER
          value: unused
        - name: DB_PASSWORD
          value: unused
        - name: STATIC_ROOT
          value: /staticfiles
        volumeMounts:
        - name: static
          mountPath: /staticfiles
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
            add:
            - CHOWN
            - DAC_OVERRIDE
            - FOWNER
            - SETGID
            - SETUID
      - name: static-user
        image: greenmart/user-service
        imagePullPolicy: IfNotPresent
        command:
        - python
        - manage.py
        - collectstatic
        - --noinput
        env:
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: greenmart-secrets
              key: SECRET_KEY
        - name: INTERNAL_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: greenmart-secrets
              key: INTERNAL_API_TOKEN
        - name: DB_NAME
          value: unused
        - name: DB_USER
          value: unused
        - name: DB_PASSWORD
          value: unused
        - name: STATIC_ROOT
          value: /staticfiles
        volumeMounts:
        - name: static
          mountPath: /staticfiles
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
            add:
            - CHOWN
            - DAC_OVERRIDE
            - FOWNER
            - SETGID
            - SETUID
      - name: static-catalog
        image: greenmart/catalog-service
        imagePullPolicy: IfNotPresent
        command:
        - python
        - manage.py
        - collectstatic
        - --noinput
        env:
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: greenmart-secrets
              key: SECRET_KEY
        - name: INTERNAL_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: greenmart-secrets
              key: INTERNAL_API_TOKEN
        - name: DB_NAME
          value: unused
        - name: DB_USER
          value: unused
        - name: DB_PASSWORD
          value: unused
        - name: STATIC_ROOT
          value: /staticfiles
        volumeMounts:
        - name: static
          mountPath: /staticfiles
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
            add:
            - CHOWN
            - DAC_OVERRIDE
            - FOWNER
            - SETGID
            - SETUID
      containers:
      - name: nginx
        image: nginx:1.27-alpine
        ports:
        - name: http
          containerPort: 80
        readinessProbe:
          httpGet:
            path: /gateway-health
            port: 80
          initialDelaySeconds: 3
          periodSeconds: 5
        livenessProbe:
          tcpSocket:
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 20
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 256Mi
        volumeMounts:
        - name: nginx-conf
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
          readOnly: true
        - name: nginx-conf
          mountPath: /etc/nginx/proxy_params
          subPath: proxy_params
          readOnly: true
        - name: static
          mountPath: /staticfiles
          readOnly: true
        - name: media
          mountPath: /media
          readOnly: true
      volumes:
      - name: nginx-conf
        configMap:
          name: gateway-nginx
      - name: static
        emptyDir: {}
      - name: media
        persistentVolumeClaim:
          claimName: greenmart-media
          readOnly: true

---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: greenmart
spec:
  selector:
    app.kubernetes.io/name: gateway
  ports:
  - name: http
    port: 80
    targetPort: http
