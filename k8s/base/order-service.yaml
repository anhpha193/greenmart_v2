apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  labels:
    app.kubernetes.io/name: order-service
    app.kubernetes.io/part-of: greenmart
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: order-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: order-service
        app.kubernetes.io/part-of: greenmart
        greenmart/db-client: 'true'
    spec:
      # Rải pod đều các node: không để một node 100% CPU trong khi node khác còn trống
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: order-service
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      containers:
      - name: app
        image: greenmart/order-service
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8000
        envFrom:
        - configMapRef:
            name: greenmart-config
        env:
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: greenmart-secrets
              key: SECRET_KEY
        - name: INTERNAL_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: greenmart-secrets
              key: INTERNAL_API_TOKEN
        - name: DB_NAME
          value: order_db
        - name: DB_USER
          value: order_svc
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: greenmart-secrets
              key: ORDER_DB_PASSWORD
        - name: RUN_MIGRATE
          value: '0'
        # Ghi đè DB_CONN_MAX_AGE=0 của overlay EKS: order-service chạm MySQL ở gần như mọi request, mở kết nối mới mỗi
        # lần làm RDS tốn CPU. Giữ kết nối 60s: tối đa 4 pod x 2 worker x 4 thread = 32 kết nối (RDS cho 150).
        - name: DB_CONN_MAX_AGE
          value: '60'
        readinessProbe:
          httpGet:
            path: /health/
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          tcpSocket:
            port: 8000
          initialDelaySeconds: 20
          periodSeconds: 20
          failureThreshold: 3
        resources:
          requests:
            cpu: 100m
            memory: 192Mi
          # Không giới hạn CPU: giới hạn 1 core làm pod bị bóp (throttle) theo từng 100ms ngay cả khi node còn dư,
          # gây các đợt p95 tăng vọt. requests.cpu vẫn giữ để lịch pod và để HPA tính % sử dụng.
          limits:
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
            add:
            - CHOWN
            - DAC_OVERRIDE
            - FOWNER
            - SETGID
            - SETUID

---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  labels:
    app.kubernetes.io/name: order-service
    app.kubernetes.io/part-of: greenmart
spec:
  selector:
    app.kubernetes.io/name: order-service
  ports:
  - name: http
    port: 8000
    targetPort: http
