# Overlay EKS (chỉ dùng dịch vụ có trong AWS Free plan):
#   RDS MySQL, ElastiCache (Valkey), S3 cho ảnh sản phẩm, SQS cho sự kiện đơn hàng: tạo bằng Terraform (infra/terraform)
#   ALB HTTP do Ingress tạo; CloudFront đặt trước ALB: infra/terraform-edge (chạy sau khi ALB có địa chỉ)
# Terraform tạo sẵn trong namespace greenmart: Secret greenmart-secrets, ConfigMap greenmart-infra
# (REDIS_URL, MEDIA_BUCKET, ORDER_EVENTS_QUEUE_URL, AWS_REGION...) và ServiceAccount có role IRSA
# (catalog-service: ghi S3; order-service: gửi SQS; order-worker: nhận SQS). Phải chạy Terraform trước khi apply overlay.
# Cần AWS Load Balancer Controller (infra/eks-bootstrap).  Triển khai:  kubectl apply -k k8s/overlays/eks
# Đổi các giá trị đánh dấu "ĐỔI" (account id ECR, RDS endpoint). Sau khi có DNS của load balancer: xem README.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: greenmart

resources:
  - ../../base
  - storageclass-ebs.yaml
  - ingress-alb.yaml
  - networkpolicy-monitoring.yaml
  - order-worker.yaml

# Image ECR (ĐỔI account id/region/tag). Khớp theo tên image sau khi base đã áp dụng `images:`.
images:
  - { name:  docker.io/noobcoder1219/user-service,      newName: 410098332444.dkr.ecr.ap-southeast-1.amazonaws.com/greenmart/user-service,      newTag: 1.0.0 }
  - { name: docker.io/noobcoder1219/catalog-service,    newName: 410098332444.dkr.ecr.ap-southeast-1.amazonaws.com/greenmart/catalog-service,   newTag: 1.0.1 }
  - { name: docker.io/noobcoder1219/order-service,      newName: 410098332444.dkr.ecr.ap-southeast-1.amazonaws.com/greenmart/order-service,     newTag: 1.0.0 }
  - { name: docker.io/noobcoder1219/promotion-service,  newName: 410098332444.dkr.ecr.ap-southeast-1.amazonaws.com/greenmart/promotion-service, newTag: 1.0.0 }
  - { name: docker.io/noobcoder1219/web,                newName: 410098332444.dkr.ecr.ap-southeast-1.amazonaws.com/greenmart/web,               newTag: 1.0.0 }

patches:
  # --- Dùng RDS: bỏ MySQL container ---
  - patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: StatefulSet
      metadata: { name: mysql }
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata: { name: mysql }
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: ConfigMap
      metadata: { name: mysql-init }
  - patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata: { name: allow-db-clients-to-mysql }

  # --- ConfigMap: RDS endpoint + chạy HTTP (chưa có domain/TLS) ---
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata: { name: greenmart-config }
      data:
        DB_HOST: greenmart-mysql.c78uwqck0isg.ap-southeast-1.rds.amazonaws.com   # ĐỔI: output rds_address của Terraform
        PUBLIC_SCHEME: http
        PUBLIC_HOST: k8s-greenmar-greenmar-8cc3475723-52143455.ap-southeast-1.elb.amazonaws.com            # ĐỔI sau khi có DNS của LoadBalancer (dùng cho link trong email đặt lại mật khẩu)
        CSRF_TRUSTED_ORIGINS: http://k8s-greenmar-greenmar-8cc3475723-52143455.ap-southeast-1.elb.amazonaws.com   # ĐỔI cùng lúc: http://<DNS của LoadBalancer>
        WEB_ALLOWED_HOSTS: "*"            # chưa có domain cố định; siết lại khi có domain
        ENABLE_PROMETHEUS: "1"
        PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus-multiproc
        DB_CONN_MAX_AGE: "0"              # RDS micro chỉ 60-150 kết nối; giữ kết nối theo thread sẽ vượt giới hạn khi HPA scale

  # --- Mọi service đọc thêm ConfigMap greenmart-infra (Terraform tạo): REDIS_URL, MEDIA_BUCKET, ORDER_EVENTS_QUEUE_URL... ---
  - target: { kind: Deployment, labelSelector: "app.kubernetes.io/part-of=greenmart,app.kubernetes.io/name in (web,user-service,catalog-service,order-service,promotion-service)" }
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/envFrom/-
        value: { configMapRef: { name: greenmart-infra } }

  # --- ServiceAccount có role IRSA (Terraform tạo) ---
  - target: { kind: Deployment, name: catalog-service }
    patch: |-
      - op: add
        path: /spec/template/spec/serviceAccountName
        value: catalog-service
  - target: { kind: Deployment, name: order-service }
    patch: |-
      - op: add
        path: /spec/template/spec/serviceAccountName
        value: order-service

  # --- Ảnh sản phẩm trên S3: catalog-service không còn ổ EBS nên chạy nhiều pod và có HPA như base ---
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata: { name: greenmart-media }
  - target: { kind: Deployment, name: catalog-service }
    patch: |-
      - op: remove
        path: /spec/template/spec/volumes
      - op: remove
        path: /spec/template/spec/containers/0/volumeMounts

  # --- Gateway: /media/ đi thẳng tới S3 (gateway-nginx-patch.yaml), không mount volume ảnh; mở ra Internet qua ALB ---
  - path: gateway-nginx-patch.yaml
  - target: { kind: Deployment, name: gateway }
    patch: |-
      - op: remove
        path: /spec/template/spec/volumes/2
      - op: remove
        path: /spec/template/spec/containers/0/volumeMounts/3
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts/-
        value: { name: nginx-conf, mountPath: /etc/nginx/templates/media.conf.template, subPath: media.conf.template, readOnly: true }
      - op: add
        path: /spec/template/spec/containers/0/envFrom
        value:
          - configMapRef: { name: greenmart-infra }
  # Service gateway giữ ClusterIP; ALB do Ingress `greenmart-alb` tạo (ingress-alb.yaml). Bỏ Ingress nginx của base.
  - patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata: { name: greenmart }

  # --- NetworkPolicy: traffic từ load balancer không đến từ namespace ingress ---
  - target: { kind: NetworkPolicy, name: allow-ingress-controller-to-gateway }
    patch: |-
      - op: replace
        path: /spec/ingress/0/from
        value:
          - ipBlock: { cidr: 0.0.0.0/0 }
