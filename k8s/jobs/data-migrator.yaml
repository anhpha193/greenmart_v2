# Bước 2: chạy SAU khi các Job migrate-* đã Complete. Mặc định chỉ --dry-run (thống kê, không ghi gì).
# Image build từ scripts/Dockerfile: docker build -f scripts/Dockerfile -t <registry>/greenmart-data-migrator:1.0 .
apiVersion: batch/v1
kind: Job
metadata:
  name: data-migrator
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        greenmart/db-client: 'true'
        app.kubernetes.io/part-of: greenmart
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      containers:
      - name: migrator
        image: greenmart/data-migrator   # workflow EKS 7 đổi thành image ECR theo image_tag
        # Dạng --tham-số=giá-trị: mật khẩu master do RDS tự sinh có thể bắt đầu bằng "-", viết tách hai dòng
        # thì argparse hiểu nhầm là một option khác ("--password: expected one argument").
        command:
        - python
        - /scripts/migrate_sqlite_to_mysql.py
        - --sqlite=/legacy/db.sqlite3
        - --host=$(DB_HOST)
        - --user=$(MYSQL_USER)
        - --password=$(MYSQL_PASSWORD)
        - --truncate
        # - --dry-run          (workflow EKS 7 bỏ dấu # khi migrate_dry_run = true)
        envFrom:
        - configMapRef:
            name: greenmart-config
        env:
        - name: MYSQL_USER
          value: admin
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: greenmart-secrets
              key: MYSQL_ROOT_PASSWORD
        volumeMounts:
        - name: legacy
          mountPath: /legacy
          readOnly: true
      volumes:
      - name: legacy
        persistentVolumeClaim:
          claimName: greenmart-legacy-data
